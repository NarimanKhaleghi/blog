# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 🌱 دِ پی اِم
  pageTitleSuffix: "|The PM"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: fa-IR
  baseUrl: thepm.ir
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: false
    typography:
      header: Vazirmatn
      body: Vazirmatn
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#f4f3ee"
        lightgray: "#d9d8cf"
        gray: "#6c6960"
        darkgray: "#1f1f24"
        dark: "#101013"
        secondary: "#101013"
        tertiary: "#101013"
        highlight: "#1010130f"
        textHighlight: "#1010131f"
      darkMode:
        light: "#0a0a0b"
        lightgray: "#1f1f22"
        gray: "#96938a"
        darkgray: "#d4d3cc"
        dark: "#f2f1ec"
        secondary: "#f2f1ec"
        tertiary: "#f2f1ec"
        highlight: "#f2f1ec0f"
        textHighlight: "#f2f1ec1f"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/explicit-publish
    enabled: true
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
    options: {}
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
      display: all
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
      display: all
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
    options: {}
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
    options: {}
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
    options: {}
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: NarimanKhaleghi/blog
        repoId: R_kgDOSwc8Hg
        category: General
        categoryId: DIC_kwDOSwc8Hs4C-pkX
        lang: fa
        mapping: pathname
        strict: true
        reactionsEnabled: true
        inputPosition: top
        themeUrl: https://giscus.app/themes
        darkTheme: dark
        lightTheme: light
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/recent-notes
    enabled: true
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: true
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/footer
    enabled: true
    order: 50
    options:
      links:
        GitHub: https://github.com/NarimanKhaleghi
        LinkedIn: https://www.linkedin.com/in/narimankhaleghi/
        Telegram: https://t.me/narimankhaleghi
  - source: github:quartz-community/obsidian-plugin-ttrpg-tools-maps
    enabled: true
    order: 50
    options:
      blockLanguage: zoommap
      inlineBlockHeaderId: ZOOMMAP-DATA
      maxInlineDataBytes: 0
      defaultIconKey: pin-red
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
